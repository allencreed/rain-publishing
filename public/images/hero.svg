<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0.45" r="0.75">
      <stop offset="0" stop-color="#0B3A75"/>
      <stop offset="0.55" stop-color="#062652"/>
      <stop offset="1" stop-color="#020621"/>
    </radialGradient>
    <linearGradient id="pageGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A9C7FF" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#A9C7FF" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <!-- rain streaks -->
  <g stroke="#A9C7FF" stroke-opacity="0.18" stroke-width="2" stroke-linecap="round">
    <line x1="180" y1="40" x2="120" y2="220"/>
    <line x1="420" y1="0" x2="380" y2="160"/>
    <line x1="720" y1="60" x2="660" y2="240"/>
    <line x1="980" y1="0" x2="930" y2="180"/>
    <line x1="1240" y1="50" x2="1180" y2="240"/>
    <line x1="1460" y1="20" x2="1410" y2="190"/>
    <line x1="90" y1="480" x2="50" y2="620"/>
    <line x1="1520" y1="520" x2="1480" y2="660"/>
    <line x1="300" y1="700" x2="260" y2="840"/>
    <line x1="1300" y1="740" x2="1260" y2="880"/>
  </g>
  <!-- open book with glowing pages -->
  <g transform="translate(800 520)">
    <path d="M-260 40 C-160 -30, -60 -50, 0 -30 C60 -50, 160 -30, 260 40 L260 200 C160 130, 60 120, 0 140 C-60 120, -160 130, -260 200 Z" fill="#020621"/>
    <path d="M0 -30 C-60 -50, -160 -30, -260 40 L-260 200 C-160 130, -60 120, 0 140 Z" fill="url(#pageGlow)" opacity="0.85"/>
    <path d="M0 -30 C60 -50, 160 -30, 260 40 L260 200 C160 130, 60 120, 0 140 Z" fill="url(#pageGlow)" opacity="0.7"/>
    <line x1="0" y1="-30" x2="0" y2="140" stroke="#0B3A75" stroke-width="4"/>
    <!-- rising light motes -->
    <circle cx="0" cy="-120" r="5" fill="#A9C7FF" opacity="0.8"/>
    <circle cx="-110" cy="-60" r="4" fill="#A9C7FF" opacity="0.5"/>
    <circle cx="120" cy="-90" r="6" fill="#A9C7FF" opacity="0.55"/>
    <circle cx="-70" cy="-180" r="3" fill="#A9C7FF" opacity="0.4"/>
    <circle cx="60" cy="-200" r="4" fill="#A9C7FF" opacity="0.45"/>
    <circle cx="180" cy="-40" r="3" fill="#A9C7FF" opacity="0.35"/>
    <circle cx="-200" cy="-20" r="4" fill="#A9C7FF" opacity="0.4"/>
  </g>
  <path d="M0 900 L0 780 Q 450 700 900 760 T 1600 740 L1600 900 Z" fill="#020621" opacity="0.55"/>
</svg>
